<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' aria-hidden='true'%3E%3Ccircle cx='6.5' cy='9' r='4.5' fill='%23FF6B1F'/%3E%3Ccircle cx='6.5' cy='31' r='4.5' fill='%23FF6B1F'/%3E%3Cpath d='M33 5 17 20l16 15' fill='none' stroke='%23FF6B1F' stroke-width='8.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · kick.ai</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B0C;--card:#141619;--line:rgba(255,255,255,.08);--tx:#F2F3F4;--mut:#9BA1A6;--acc:#FF6B1F;--ok:#3FB97F;--run:#F2B53A;--bad:#E8605A;--q:#5B9BF0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Figtree,system-ui,sans-serif;font-size:15px}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}h1{font-size:26px;font-weight:600;margin:6px 0 16px;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0F1113;color:var(--tx);font:inherit;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 18px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.p{background:var(--acc);color:#1A0B02}.btn.g{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--tx)}
.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.on{background:var(--ok)}.off{background:#555}
.badge{font-size:12px;padding:3px 9px;border-radius:12px;white-space:nowrap;background:#2A2D31;align-self:center;line-height:1.4}
.b-queued{background:var(--q)}.b-analysing{background:var(--run);color:#111}.b-done{background:var(--ok);color:#06120C}.b-failed{background:var(--bad)}
.m{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.m:first-child{border:0}.m .t{flex:1;min-width:0}
.grp{margin:18px 0 6px;font-weight:600}a{color:#FFB27F}select{background:#0F1113;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.bad{color:var(--bad)}.hide{display:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:820px}
.board th{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:6px 4px;text-align:center;white-space:nowrap}
.board th.you{color:#B48CFF}.board th:first-child,.board td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:180px;max-width:230px}
.board td{padding:8px 4px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
.cell{display:inline-flex;flex-direction:column;align-items:center;min-width:52px;font-size:12px;color:var(--mut)}.cell i{font-style:normal;font-size:16px;line-height:20px}
.c-done i{color:var(--ok)}.c-running i{color:var(--run)}.c-failed i{color:var(--bad)}.c-you i,.c-you{color:#B48CFF}.c-waiting i,.c-soon i{color:#555}.youc{border-color:rgba(180,140,255,.45)}
.b-your{background:#B48CFF;color:#160B2B}.b-finishing{background:var(--run);color:#111}
</style></head><body>

<style>
.kn{position:sticky;top:0;z-index:60;background:rgba(10,11,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);font-family:Figtree,system-ui,sans-serif}
body{margin:0}
.kn *{box-sizing:border-box}
.kn a{text-decoration:none;margin:0;text-shadow:none}
.kn nav{margin:0}
.kn-in{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.kn-logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:20px;letter-spacing:-.02em;color:#F2F3F4}
.kn-logo svg{width:26px;height:26px}
.kn-btn{font-family:inherit;text-shadow:none}
.kn-links{display:flex;gap:28px;font-size:14px}
.kn-links a{color:#9BA1A6;white-space:nowrap;padding:6px 0;border-bottom:2px solid transparent;font-size:14px;font-weight:400}
.kn-links a:hover{color:#F2F3F4}
.kn-links a[aria-current=page]{color:#F2F3F4;border-bottom-color:#FF6B1F}
.kn-cta{display:flex;gap:8px;align-items:center}
.kn-btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;font-size:14px;font-weight:500;border-radius:8px;white-space:nowrap;border:1px solid transparent}
.kn-btn.p{background:#FF6B1F;color:#1A0B02}
.kn-btn.g{border-color:rgba(255,255,255,.14);color:#F2F3F4}
.kn-burger{display:none;width:40px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:transparent;padding:0;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.kn-burger span{display:block;width:16px;height:1.6px;background:#F2F3F4;border-radius:2px;transition:transform .25s,opacity .25s}
.kn-burger[aria-expanded=true] span:nth-child(1){transform:translateY(5.6px) rotate(45deg)}
.kn-burger[aria-expanded=true] span:nth-child(2){opacity:0}
.kn-burger[aria-expanded=true] span:nth-child(3){transform:translateY(-5.6px) rotate(-45deg)}
.kn-drawer{display:flex;flex-direction:column;padding:8px 24px 20px;border-top:1px solid rgba(255,255,255,.08);background:rgba(10,11,12,.97)}
.kn-drawer[hidden]{display:none}
.kn-drawer a:not(.kn-btn){padding:14px 0;font-size:17px;color:#F2F3F4;border-bottom:1px solid rgba(255,255,255,.08)}
.kn-drawer a[aria-current=page]{color:#FF6B1F}
.kn-drawer .kn-btn{margin-top:16px;height:44px;font-size:15px}
@media (max-width:920px){.kn-links{display:none}.kn-burger{display:inline-flex}}
@media (min-width:921px){.kn-drawer{display:none!important}}
@media (max-width:420px){.kn-cta .kn-btn.p{display:none}}
</style>
<header class="kn">
  <div class="kn-in">
    <a class="kn-logo" href="../" aria-label="kick.ai inicio"><svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><circle cx="6.5" cy="9" r="4.5" fill="#FF6B1F"/><circle cx="6.5" cy="31" r="4.5" fill="#FF6B1F"/><path d="M33 5 17 20l16 15" fill="none" stroke="#FF6B1F" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>kick.ai</a>
    <nav class="kn-links" aria-label="Principal"><a href="../#servicio">Servicio</a><a href="../#para-quien">Para quién</a><a href="../#planes">Planes</a><a href="../torneos.html#/torneos">Torneos</a><a href="../equipos/">Equipos</a><a href="https://claude.ai/artifact/RG7pwsMTZe8Zc5FAbdBi7a" target="_blank" rel="noopener">Calificar y Revisar</a><a href="./" aria-current="page">Admin</a></nav>
    <div class="kn-cta">
      <a href="../torneos.html#/torneos" class="kn-btn g">Buscá tu partido</a>
      <a href="../#contacto" class="kn-btn p">Pedí presupuesto</a>
      <button class="kn-burger" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="kn-drawer"><span></span><span></span><span></span></button>
    </div>
  </div>
  <nav class="kn-drawer" id="kn-drawer" aria-label="Menú" hidden><a href="../#servicio">Servicio</a><a href="../#para-quien">Para quién</a><a href="../#planes">Planes</a><a href="../torneos.html#/torneos">Torneos</a><a href="../equipos/">Equipos</a><a href="https://claude.ai/artifact/RG7pwsMTZe8Zc5FAbdBi7a" target="_blank" rel="noopener">Calificar y Revisar</a><a href="./" aria-current="page">Admin</a><a href="../#contacto" class="kn-btn p">Pedí presupuesto</a></nav>
</header>
<script>(function(){var b=document.querySelector('.kn-burger'),d=document.getElementById('kn-drawer');if(!b||!d)return;
var set=function(o){d.hidden=!o;b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Cerrar menú':'Abrir menú')};
b.addEventListener('click',function(e){e.stopPropagation();set(d.hidden)});
d.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){set(false)})});
document.addEventListener('click',function(e){if(!d.hidden&&!d.contains(e.target))set(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!d.hidden){set(false);b.focus()}});
addEventListener('hashchange',function(){set(false)});addEventListener('resize',function(){if(innerWidth>920)set(false)});})();</script>
<!-- /KN-NAV -->
<main>
<h1>Admin</h1>
<div id=login class=card style="max-width:380px">
  <div>Sign in with your user.</div><div id=msg class=bad></div>
  <form onsubmit="go(event)"><input id=u placeholder="User" autocomplete=username autocapitalize=off>
  <input id=p type=password placeholder="Password" autocomplete=current-password>
  <button class="btn p" style="margin-top:12px;width:100%">Sign in</button></form>
</div>
<div id=app class=hide></div>
</main>
<script>
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""),unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const esc=s=>(s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function derive(u,p){const k=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveBits"]);
 return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode("kickai-admin:"+u),iterations:200000,hash:"SHA-256"},k,256))}
async function hmac(key,msg){const k=await crypto.subtle.importKey("raw",key,{name:"HMAC",hash:"SHA-256"},false,["sign"]);return new Uint8Array(await crypto.subtle.sign("HMAC",k,enc.encode(msg)))}
async function sha(s){return hex(await crypto.subtle.digest("SHA-256",enc.encode(s)))}
let U=null,K=null,D=null,tf="";
async function load(){const f=(await sha("kickai-file:"+U)).slice(0,16);
 const r=await fetch(`data/${f}.enc?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error("nouser");
 const b=Uint8Array.from(atob((await r.text()).trim()),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey("raw",await hmac(K,"enc"),"AES-GCM",false,["decrypt"]);
 D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12))))}
async function go(e){e&&e.preventDefault();$m("");try{U=$("#u").value.trim();K=await derive(U,$("#p").value);await load();
 sessionStorage.setItem("kadm",JSON.stringify([U,hex(K)]));show()}catch(x){$m("Wrong user or password.")}}
const $=s=>document.querySelector(s),$m=t=>$("#msg").textContent=t;
let live=null;
async function checkPod(){live=false;if(!D.pod.url)return;try{const c=new AbortController();setTimeout(()=>c.abort(),5000);
 const r=await fetch(D.pod.url+"/health",{signal:c.signal,cache:"no-store"});live=r.ok}catch(e){live=false}}
async function openPanel(){const ts=Math.floor(Date.now()/1000);const sig=hex(await hmac(await hmac(K,"sso"),`${U}|${ts}`));
 location.href=`${D.pod.url}/sso?u=${encodeURIComponent(U)}&ts=${ts}&sig=${sig}`}
const COLS=[["Download","Download"],["Players","Players"],["Camera","Camera"],["Tracking","Tracking"],["Ball search","Ball"],["Pitch map","Pitch"],["Pitch OK?","Pitch OK?"],["Analysis","Analysis"],["Goals OK?","Goals OK?"],["Upload results","Drive"],["Website","Website"]];
const JS={running:"analysing",waiting:"starting",resume:"waiting for the GPU",review_pitch:"waiting for you: Pitch OK?",review_goals:"waiting for you: Goals OK?",finishing:"finishing",failed:"stopped"};
function cell(st){const ic={done:"✓",running:"●",failed:"✕",you:"?",soon:"—",waiting:"·"}[st]||"·";
 return `<span class="cell c-${st}"><i>${ic}</i>${st=="running"?"running":st=="failed"?"failed":st=="you"?"you":st=="soon"?"soon":""}</span>`}
function board(){const B=D.board||[],title=s=>(D.matches.find(m=>m.slug==s)||{title:s}).title,inb=new Set(B.map(b=>b.slug)),bl=D.queue.filter(s=>!inb.has(s)),you=B.filter(b=>b.state.startsWith("review_"));
 return `${you.length?`<div class="card youc"><b>Waiting for you (${you.length})</b>${you.map(b=>`<div class=m><div class=t>${esc(title(b.slug))}<div class=mut>${b.state=="review_pitch"?"Pitch OK? · lines + our two goals":"Goals OK? · kick-offs, goals, corners"}${live?"":" · start the pod to check"}</div></div></div>`).join("")}</div>`:""}
 <div class=grp>In progress <span class=mut>${B.length?"("+B.length+")":""}</span></div>
 <div class=card>${B.length?`<div class=scroll><table class=board><tr><th>Match</th>${COLS.map(c=>`<th class="${c[0].endsWith("?")?"you":""}">${c[1]}</th>`).join("")}</tr>
 ${B.map(b=>`<tr><td><div style="font-weight:500">${esc(title(b.slug))}</div><div class=mut>${esc(JS[b.state]||b.state)}</div>${b.error?`<div class="mut bad">${esc(b.error)}</div>`:""}</td>${COLS.map(c=>`<td>${cell(b.steps[c[0]]||"waiting")}</td>`).join("")}</tr>`).join("")}</table></div>`:`<div class=mut>Nothing in progress.</div>`}</div>
 <div class=grp>Backlog <span class=mut>${bl.length?"("+bl.length+" waiting to run)":""}</span></div>
 <div class=card>${bl.length?bl.map((s,i)=>`<div class=m><div class=t>${i+1}. ${esc(title(s))}</div></div>`).join(""):`<div class=mut>Empty.</div>`}</div>`}
const ST={new:"new",queued:"queued",analysing:"analysing",done:"done",failed:"failed",running:"analysing",waiting:"queued"};
const ago=t=>{const s=Date.now()/1000-t;return s<120?"just now":s<7200?`${Math.round(s/60)} min ago`:s<172800?`${Math.round(s/3600)} h ago`:`${Math.round(s/86400)} days ago`};
async function show(){$("#login").classList.add("hide");$("#app").classList.remove("hide");await checkPod();draw()}
function draw(){const ms=D.matches.filter(m=>!tf||m.tournament==tf),ts=[...new Set(D.matches.map(m=>m.tournament))].sort(),g={};
 ms.forEach(m=>(g[m.tournament]=g[m.tournament]||[]).push(m));const title=s=>(D.matches.find(m=>m.slug==s)||{title:s}).title;
 $("#app").innerHTML=`<div class=card><div class=row><span class="dot ${live?"on":"off"}"></span><b style="flex:1">${live?"Pod is on":"Pod is off"}</b>
 ${live?`<button class="btn p" onclick="openPanel()">Open control panel</button>`:""}<button class="btn g" onclick="localStorage.clear();sessionStorage.clear();location.reload()">Sign out</button></div>
 <div class=mut style="margin-top:8px">${live?"From the panel you can choose matches, queue them and follow the analysis.":"Read only: showing the last saved information."} Updated ${ago(D.updated)}${D.pod.gpu?" · "+esc(D.pod.gpu):""}.</div></div>
 ${board()}
 <div class=row><b style="flex:1">Matches (${D.matches.length})</b><select onchange="tf=this.value;draw()"><option value="">All tournaments</option>${ts.map(t=>`<option ${t==tf?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
 ${Object.keys(g).map(k=>`<div class=grp>${esc(k)} <span class=mut>(${g[k].length})</span></div><div class=card>${g[k].map(m=>`<div class=m><div class=t>${esc(m.title)}
 <div class=mut>${esc(m.date)} · ${m.min} min · ${m.goals} goals · ${m.shots} shots · <a href="${m.veo}" target=_blank rel=noopener>Veo</a>${m.results?` · <a href="${m.results}" target=_blank rel=noopener>Results</a>`:""}</div></div>
 <span class="badge b-${m.status.split(" ")[0]}">${ST[m.status]||m.status}</span></div>`).join("")}</div>`).join("")||`<div class="card mut">No matches yet.</div>`}`}
(async()=>{const s=sessionStorage.getItem("kadm");if(s){try{[U,K]=JSON.parse(s);K=unhex(K);await load();show()}catch(e){sessionStorage.clear()}}})();
</script></body></html>
