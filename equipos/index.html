<!doctype html>
<html lang="es-AR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>kick.ai · Equipos</title>
<meta name="description" content="Resultados, goles y videos de cada fecha de tu torneo.">
<meta property="og:title" content="kick.ai · Equipos">
<meta property="og:description" content="Resultados, goles y videos de cada fecha de tu torneo.">
<meta name="theme-color" content="#0A0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=Cinzel:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column; from 960px the league and team pages split into two columns. kick.ai's own world: near-black, Figtree, orange. JAG's black + gold only on the league banner. */
:root{
  --bg:#0A0B0C;
  --surface:#111315;
  --surface-2:#16191B;
  --surface-3:#24282C;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.16);
  --fg:#F2F3F4;
  --muted:#9AA0A4;
  --faint:#7D8187;
  --accent:#FF6B1F;
  --accent-soft:rgba(255,107,31,.12);
  --accent-ink:#1A0A00;
  --win:#34D399;
  --loss:#F87171;
  --draw:#FBBF24;
  --gold:#D4B26A;
  --gold-hi:#F1DDA6;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-jag:"Cinzel","Times New Roman",serif;
  --r-sm:6px; --r-md:10px; --r-lg:12px;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
::selection{background:var(--accent);color:var(--accent-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:-.03em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,11,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:20px;letter-spacing:-.02em}
.logo svg{width:26px;height:26px}
.nav-links{display:flex;gap:28px;font-size:14px;color:var(--muted);margin-left:auto}
.nav-links a:hover,.nav-links a[aria-current]{color:var(--fg)}
.topbar .grow{flex:0 0 12px}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:8px;font-weight:500;font-size:14px;background:var(--accent);color:var(--accent-ink);transition:background .2s}
.nav-btn:hover{background:#FF7D3A}
.nav-cta{display:flex;gap:8px}
.nav-btn.ghost{background:none;color:var(--fg);border:1px solid rgba(255,255,255,.14)}
.nav-btn.ghost:hover{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.3)}
@media (max-width:760px){
  .topbar-in{flex-wrap:wrap}
  .nav-links{display:none}
  .topbar .grow{flex:1}
  .topbar .ctx{order:5;flex-basis:100%;justify-content:center;margin:0 0 10px;min-height:32px}
}
@media (max-width:420px){.nav-btn:not(.ghost){display:none}}
.grow{flex:1}
.ctx{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.ctx .ic{width:16px;height:16px;color:var(--accent)}
.ctx b{color:var(--accent);font-weight:700}

main{max-width:1120px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:44px;min-width:0}
.view.tight{gap:12px}
.section{display:grid;gap:16px;min-width:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.sh h2{font-size:22px;font-weight:500;display:flex;align-items:center;gap:8px}
.sh h2 .ic{color:var(--accent);width:22px;height:22px}
.sh .aside{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gate{display:grid;gap:14px;padding-block:48px 24px;max-width:520px}
.gate h1{font-size:clamp(44px,11vw,72px);font-weight:400;letter-spacing:-.04em;line-height:1}
.gate p{color:var(--muted)}
.gate-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gate-form input{flex:1 1 200px;min-height:46px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font:inherit;outline:none;transition:border-color .2s}
.gate-form input:focus{border-color:var(--accent)}
.gate-form input::placeholder{color:var(--faint)}
.gate-err{color:var(--loss);font-size:14px}
.two{display:grid;gap:44px;min-width:0}
.player-wrap{width:100%}
.mbox{display:grid;min-height:190px}
.mbox > *{min-height:100%}
.mbox .formstrip{align-items:stretch}
.mbox .fm{align-content:space-between}
.mbox .results.one{max-width:none}
@media (max-width:639px){
  .sh .seg button{padding:0 9px;font-size:12.5px}
  .player-wrap{width:auto;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)))}
  .player-wrap .player{border-radius:0;border-inline:0;padding-inline:max(16px, env(safe-area-inset-left,0px))}
  .player-wrap .stage{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));border-radius:0;max-width:none}
}
.foot-note{font-size:12px;color:var(--faint);text-align:center;padding-top:8px}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:none}}

/* ---------- tooltip ---------- */
.tip{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--faint);transition:color .2s,background .2s;vertical-align:middle;position:relative}
.tip::before{content:"";position:absolute;inset:-11px}
.tip .ic{width:16px;height:16px}
.tip:hover,.tip[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
#tipBox{position:fixed;z-index:60;left:0;top:0;max-width:240px;padding:10px 12px;border-radius:var(--r-md);background:var(--fg);color:#111214;font-size:13px;line-height:1.4;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease)}
#tipBox.on{opacity:1;transform:none}
#tipBox b{font-weight:700}

/* ---------- shield ---------- */
.shield{display:block;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}

/* ---------- JAG banner ---------- */
.jag{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:28px 20px 22px;text-align:center;display:grid;gap:12px;justify-items:center;
  background:radial-gradient(80% 70% at 50% 115%,rgba(212,178,106,.55),transparent 70%),radial-gradient(50% 60% at 100% 0%,rgba(212,178,106,.18),transparent 70%),linear-gradient(180deg,#050505 0%,#14100A 55%,#3A2E17 100%);border:1px solid rgba(212,178,106,.28)}
.jag-mono{position:relative;width:74px;height:80px;filter:drop-shadow(0 6px 18px rgba(212,178,106,.35))}
.jag-swoosh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.jag > *:not(.jag-swoosh){position:relative}
.jag-kicker{font-size:11px!important}
.jag-kicker{font-family:var(--font-jag);font-size:12px;letter-spacing:.32em;padding-left:.32em;color:var(--gold-hi);text-transform:uppercase}
.jag h1{font-family:var(--font-jag);font-weight:500;font-size:clamp(30px,8.5vw,52px);letter-spacing:.06em;line-height:1.05;color:var(--gold-hi);text-transform:uppercase}
.jag-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-family:var(--font-jag);font-size:12px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.jag-tags span+span::before{content:"·";margin-right:14px;color:rgba(212,178,106,.6)}

/* ---------- tournaments ---------- */
.intro{display:grid;gap:8px}
.intro h1{font-size:clamp(34px,9vw,56px);line-height:1.02;font-weight:400;letter-spacing:-.04em}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro p{color:var(--muted);max-width:44ch}
.tgrid{display:grid;gap:16px}
.tcard{display:grid;border-radius:var(--r-lg);overflow:hidden;border:1px solid rgba(212,178,106,.28);background:var(--surface);transition:transform .3s var(--ease),border-color .2s,box-shadow .3s}
.tcard:hover{transform:translateY(-3px);border-color:rgba(212,178,106,.6);box-shadow:0 18px 40px -18px rgba(212,178,106,.35)}
.tcard .jag{border:0;border-radius:0}
.tcard-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}
.tcard-foot .pill{background:var(--bg)}
.tcard-foot .go{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent)}
.tcard.soon{border:1px dashed var(--line-strong);background:transparent;place-items:center;text-align:center;padding:36px 18px;gap:8px;min-height:200px}
.tcard.soon:hover{transform:none;box-shadow:none;border-color:var(--line-strong)}
.tcard.soon .art{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tcard.soon h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.tcard.soon p{color:var(--muted);font-size:14px}

/* ---------- highlights ---------- */
.hl-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,78%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.hl{scroll-snap-align:start;display:grid;gap:10px;text-align:left;border-radius:var(--r-lg);transition:transform .3s var(--ease)}
.hl:hover{transform:translateY(-3px)}
.hl-thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r-lg);overflow:hidden;display:grid;place-items:center;background:radial-gradient(80% 90% at 20% 0%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),repeating-linear-gradient(100deg,#174f33 0 28px,#1b5e3b 28px 56px)}
.hl-thumb::before{content:"";position:absolute;inset:10px;border:1.5px solid rgba(255,255,255,.28);border-radius:3px}
.hl-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.7))}
.hl-thumb .play{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .3s var(--ease);box-shadow:0 10px 24px -8px rgba(255,107,31,.7)}
.hl:hover .play{transform:scale(1.08)}
.hl-thumb .play .ic{width:20px;height:20px;fill:currentColor;margin-left:3px}
.hl-thumb .kind{position:absolute;z-index:2;left:10px;top:10px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--fg);color:#111}
.hl-thumb .dur{position:absolute;z-index:2;right:10px;bottom:10px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(0,0,0,.7)}
.hl-thumb .shields{position:absolute;z-index:2;left:10px;bottom:8px;display:flex}
.hl-thumb .shields .shield+.shield{margin-left:-8px}
.hl strong{font-size:16px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.hl span.meta{font-size:13px;color:var(--muted);margin-top:-6px}

/* ---------- upcoming fixture ---------- */
.result.up{border-style:dashed;background:transparent;cursor:default}
.result.up:hover{transform:none;background:transparent}
.result.up .rs b{font-size:15px;color:var(--muted);font-weight:600}

/* ---------- stats summary ---------- */
.stats{display:grid;gap:16px;padding:16px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.stats-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats-head .who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.stats-head .who:last-child{justify-content:flex-end}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px}
.srow .lbl{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:2px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:-6px}
.srow b{font-size:18px;font-weight:700}
.srow b:last-child{text-align:right}
.srow b.lead{color:var(--accent)}

/* ---------- crests, group empty, today ---------- */
img.crest{object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:live 1.8s ease-out infinite;flex:none}
@keyframes live{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.gempty{display:grid;gap:14px;padding:18px 14px;border-radius:var(--r-lg);border:1px dashed var(--line-strong)}
.gcrests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gteam{display:grid;justify-items:center;gap:8px;text-align:center;font-size:13px;font-weight:600;line-height:1.2;padding:6px 2px;border-radius:var(--r-md);transition:background .2s}
.gteam:hover{background:var(--surface-2)}
.gempty p{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);text-align:center}
.today{display:grid;gap:8px;margin-top:8px}
.today-head{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 2px}
.today-head b{font-weight:600}
.tag .live-dot{margin-right:2px}

/* ---------- fecha selector ---------- */
.fechas{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fechas::-webkit-scrollbar{display:none}
.fecha{flex:none;min-height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;background:var(--surface);border:1px solid var(--line);transition:background .2s,color .2s,border-color .2s}
.fecha:hover{color:var(--fg);border-color:var(--line-strong)}
.fecha[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fecha.future{border:1px dashed var(--line-strong);background:transparent}
.fecha.future[aria-pressed="true"]{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent)}

/* ---------- table ---------- */
.table{display:grid;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.groups{display:grid;gap:24px}
.gname{font-family:var(--font-jag);font-weight:500;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:10px}
.thead,.row{display:grid;grid-template-columns:34px 36px minmax(0,1fr) 62px 40px;align-items:center;gap:10px;padding:0 14px}
.thead{min-height:40px;font-size:12px;color:var(--faint);font-weight:600;border-bottom:1px solid var(--line)}
.thead .r{display:flex;justify-content:flex-end;align-items:center;gap:2px}
.row{min-height:60px;border-bottom:1px solid var(--line);transition:background .2s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.me{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.rank{display:grid;justify-items:center;line-height:1}
.rank b{font-size:17px;font-weight:600}
.mv{font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:1px;margin-top:3px}
.mv.up{color:var(--win)} .mv.down{color:var(--loss)} .mv.same{color:var(--faint)}
.mv .ic{width:10px;height:10px;stroke-width:3}
.tname{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.tname .ic{width:15px;height:15px;color:var(--gold)}
.form{display:flex;gap:3px;justify-content:flex-end}
.form i{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#0B0C0D}
.form i.w{background:var(--win)} .form i.d{background:var(--draw)} .form i.l{background:var(--loss)}
.pts{text-align:right;font-size:20px;font-weight:700}

/* ---------- results ---------- */
.results{display:grid;gap:8px}
.result{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);transition:background .2s,transform .25s var(--ease)}
.result:hover{background:var(--surface-2);transform:translateY(-2px)}
.rt{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:14px;line-height:1.2}
.rt span{overflow-wrap:break-word;min-width:0}
.result{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;padding:16px 12px}
.result .rt,.result .rt.away{flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:8px;font-size:13.5px}
.result .rt > span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result .rs{padding-top:6px;gap:4px}
.result .rs b{font-size:28px;display:flex;align-items:center;gap:8px;letter-spacing:-.03em}
.result .rs b i{display:block;width:10px;height:3px;border-radius:2px;background:var(--faint);font-size:0}
.result.up .rs b{font-size:20px}
.result .rs .live-dot{width:7px;height:7px}
.today .results{margin-top:4px}
.results.one{grid-template-columns:1fr!important;max-width:440px}
.rt.away{justify-content:flex-end;text-align:right}
.rt.lost{color:var(--muted);font-weight:500}
.rs{display:grid;justify-items:center;gap:2px}
.rs b{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.rs span{font-size:11px;color:var(--faint);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.rs span .ic{width:12px;height:12px}
.rs span.vid{color:var(--accent)}

/* ---------- empty ---------- */
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:24px 18px;border-radius:var(--r-lg);border:1px dashed var(--line-strong)}
.empty .art{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);animation:bob 2.6s ease-in-out infinite}
.empty .art .ic{width:24px;height:24px}
.empty h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.empty p{color:var(--muted);font-size:14px;max-width:30ch}
@keyframes bob{50%{transform:translateY(-3px)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-sm);font-weight:600;font-size:15px;transition:background .2s,transform .2s var(--ease)}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:#FF8240}
.btn-ghost{border:1px solid var(--line-strong)}
.btn-ghost:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--muted);min-height:40px;padding-right:8px;justify-self:start}
.back:hover{color:var(--fg)}

/* ---------- team (PDP) ---------- */
.club{position:relative;overflow:hidden;border-radius:var(--r-lg);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px;padding:20px;min-height:180px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 78%,#000) 0%,color-mix(in srgb,var(--tc) 40%,#0B0C0D) 60%,#0B0C0D 100%);border:1px solid var(--line)}
.club::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px);pointer-events:none}
.club-id{position:relative;z-index:1;display:grid;gap:10px;align-content:end;min-width:0}
.club-id .shield{animation:pop .6s var(--ease) both}
.club-id h1{font-size:clamp(28px,7.5vw,44px);font-weight:500;line-height:1.02;color:#fff;overflow-wrap:anywhere}
.club-id p{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}
.pos{position:relative;z-index:1;display:grid;justify-items:end;line-height:.85;color:#fff}
.pos b{font-size:clamp(88px,26vw,132px);font-weight:700;letter-spacing:-.06em;display:flex;align-items:flex-start}
.pos b sup{font-size:.3em;font-weight:600;letter-spacing:0;margin-top:.2em;margin-left:3px}
.pos span{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px;margin-top:8px;white-space:nowrap}
.pos .mv{margin-top:0;font-size:12px}

.big4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.big4 > div{display:grid;justify-items:center;gap:4px;padding:16px 4px 14px;position:relative}
.big4 > div+div::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:1px;background:var(--line)}
.big4 strong{font-size:clamp(22px,6.4vw,28px);font-weight:500;line-height:1;letter-spacing:-.02em;color:var(--fg)}
.big4 span{display:inline-flex;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.25;padding-inline:4px}
.big4 span .ic{width:14px;height:14px;color:var(--accent)}
.big4 strong span{display:inline;font:inherit;color:inherit;letter-spacing:inherit}
.big4 .tip{width:18px;height:18px;margin-left:-2px}
.big4 .gf strong{color:color-mix(in srgb,var(--win) 70%,var(--fg))} .big4 .ga strong{color:color-mix(in srgb,var(--loss) 70%,var(--fg))}
.big4 > div{padding:14px 4px 12px}

.formstrip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(76px,1fr);gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:thin}
.formstrip .fm{scroll-snap-align:end}
.fm{display:grid;justify-items:center;align-content:space-between;gap:6px;padding:8px 6px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);transition:background .2s,transform .25s var(--ease)}
.fm:hover{background:var(--surface-2);transform:translateY(-2px)}
.fm small{font-size:11px;color:var(--faint);font-weight:600;white-space:nowrap}
.fm .shield{width:min(76px,88%);height:auto;aspect-ratio:1}
.fm .sc{font-size:14px;font-weight:700;padding:4px 0;width:100%;max-width:76px;text-align:center;border-radius:6px;color:#0B0C0D}
.fm.w .sc{background:var(--win)} .fm.d .sc{background:var(--draw)} .fm.l .sc{background:var(--loss)}

.chart-card{display:grid;gap:10px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.seg button{min-height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--faint);font-size:10px;font-weight:500}
.chart .grid{stroke:rgba(255,255,255,.05);stroke-width:1}
.chart .val{fill:var(--muted);font-size:10.5px;font-weight:600}
.chart .line{fill:none;stroke-width:1.75;opacity:.85;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .pt{animation:pop .4s var(--ease) both;animation-delay:calc(.3s + var(--i) * 120ms);transform-box:fill-box;transform-origin:center}
.chart .barg{transform-box:fill-box;transform-origin:bottom;animation:growUp .7s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
.chart .barc{transform-box:fill-box;transform-origin:top;animation:growUp .7s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes growUp{from{transform:scaleY(0)}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}

.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);border:1px dashed var(--line-strong)}
.next .q{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--faint);font-weight:700}
.next strong{display:block;font-weight:600}
.next span{font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}

.goal-strip{display:grid;grid-auto-flow:column;grid-auto-columns:136px;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gcard{scroll-snap-align:start;display:grid;gap:6px;padding:6px 6px 10px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .25s var(--ease),border-color .2s}
.gcard:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.gthumb{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:7px;overflow:hidden;background:repeating-linear-gradient(90deg,#1B5E3B 0 16px,#1F6B43 16px 32px);display:grid;place-items:center}
.gthumb::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(255,255,255,.4);border-radius:2px}
.gthumb::after{content:"";position:absolute;left:50%;top:7px;bottom:7px;width:1.5px;background:rgba(255,255,255,.4)}
.gthumb .play{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.gthumb .play .ic{width:14px;height:14px;fill:currentColor;margin-left:2px}
.gthumb .f{position:absolute;z-index:1;left:6px;top:6px;font-size:10px;font-weight:700;background:rgba(0,0,0,.65);padding:2px 6px;border-radius:4px}
.gcard strong{font-size:14px;padding-inline:4px;font-weight:600;line-height:1.2}
.gcard span{font-size:12px;color:var(--muted);padding-inline:4px;margin-top:-2px}

.mlist{display:grid;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.mrow{display:grid;grid-template-columns:44px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);transition:background .2s}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--surface-2)}
.mrow .f{display:grid;line-height:1.15}
.mrow .f b{font-size:13px;font-weight:700;color:var(--accent)}
.mrow .f span{font-size:11px;color:var(--faint)}
.mrow strong{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.mrow .sc{font-size:13px;font-weight:700;padding:4px 8px;border-radius:5px;color:#0B0C0D;font-variant-numeric:tabular-nums}
.mrow .sc.w{background:var(--win)} .mrow .sc.d{background:var(--draw)} .mrow .sc.l{background:var(--loss)}

/* ---------- match ---------- */
.mhero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px 14px 22px;display:grid;gap:16px;text-align:center;background:radial-gradient(70% 90% at 0% 0%,color-mix(in srgb,var(--hc) 30%,transparent),transparent 70%),radial-gradient(70% 90% at 100% 0%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 70%),var(--surface);border:1px solid var(--line)}
.mhero .pitchlines{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
.fecha-ctx{position:relative;justify-self:center;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.fecha-ctx .ic{width:16px;height:16px}
.duel{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.duel .side{display:grid;justify-items:center;gap:8px;min-width:0}
.duel .side .shield{animation:pop .6s var(--ease) both}
.duel .side:last-child .shield{animation-delay:.08s}
.duel .side strong{font-size:clamp(15px,4.4vw,22px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.duel .side.lost strong{color:var(--muted);font-weight:500}
.score{display:flex;align-items:center;gap:10px;font-size:clamp(52px,15vw,88px);font-weight:700;letter-spacing:-.05em;line-height:.9}
.score i{display:block;width:16px;height:4px;border-radius:2px;background:var(--faint)}
.hpills{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600}
.pill .ic{width:14px;height:14px}
.pill .tip{width:18px;height:18px;margin:-2px -6px -2px -2px}
.pill.win{background:var(--win);color:#04261A;border-color:transparent}
.hmeta{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}
.hmeta span{display:inline-flex;align-items:center;gap:5px}
.hmeta .ic{width:15px;height:15px;color:var(--accent)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:48%;left:50%;width:7px;height:11px;border-radius:2px;background:var(--c);opacity:0;animation:burst 1.4s var(--ease) forwards;animation-delay:calc(.45s + var(--d))}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}

.player{display:grid;gap:12px;padding:12px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.stage{position:relative;border-radius:var(--r-md);overflow:hidden;background:#1B5E3B;aspect-ratio:16/10;max-width:100%}
.stage canvas{display:block;width:100%;height:100%}
.slabel{position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.slabel span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;display:inline-flex;align-items:center;gap:6px}
.slabel .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.sdemo{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;color:rgba(255,255,255,.8);background:rgba(0,0,0,.55);padding:2px 8px;border-radius:999px}
.gol{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:800;font-size:clamp(42px,12vw,76px);color:#fff;letter-spacing:-.04em;text-shadow:0 6px 30px rgba(0,0,0,.5);opacity:0}
.gol.on{animation:golFlash 1.1s var(--ease) forwards}
@keyframes golFlash{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.controls{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);align-items:center;gap:8px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);transition:background .2s,transform .2s var(--ease)}
.ibtn:hover{background:var(--surface-3)}
.ibtn:active{transform:scale(.94)}
.playb{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .2s var(--ease)}
.playb:active{transform:scale(.94)}
.playb .ic{fill:currentColor;width:20px;height:20px}
.scrub{width:100%;accent-color:var(--accent);height:28px}
.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.gchip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 12px 0 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line-strong);font-weight:700;font-size:13px;transition:background .2s,border-color .2s}
.gchip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.gchip small{font-weight:500;color:var(--muted);font-size:12px}
.gchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 130px}
details.more{border-top:1px solid var(--line);padding-top:8px}
details.more summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;min-height:40px}
details.more summary::-webkit-details-marker{display:none}
details.more summary .chev{margin-left:auto;transition:transform .25s var(--ease)}
details.more[open] summary .chev{transform:rotate(180deg)}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.toggle{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:500}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

.timeline{display:grid;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.lanes{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.lanes span{display:inline-flex;align-items:center;gap:6px}
.lanes i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.track{position:relative;height:150px}
.track .lane{position:absolute;left:0;right:0;top:50%;height:3px;border-radius:2px;background:var(--surface-3);transform:translateY(-50%)}
.track .ht{position:absolute;top:24px;bottom:24px;left:50%;border-left:1.5px dashed var(--line-strong)}
.track .ht span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--faint);font-weight:600;white-space:nowrap}
.track .end{position:absolute;bottom:0;font-size:11px;color:var(--faint);font-weight:600}
.tgoal{position:absolute;width:30px;height:30px;margin-left:-15px;border-radius:50%;display:grid;place-items:center;background:var(--c);border:2px solid #fff;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.4);transition:transform .2s var(--ease);animation:pop .45s var(--ease) both;animation-delay:calc(.15s + var(--i) * 60ms)}
.tgoal .ic{width:15px;height:15px;stroke:#111;stroke-width:2.2}
.tgoal.home{top:var(--lv,4px)} .tgoal.away{bottom:var(--lv,4px)}
.tgoal:hover,.tgoal.sel{transform:scale(1.2)}
.tgoal.sel{box-shadow:0 0 0 3px var(--accent),0 4px 10px rgba(0,0,0,.4)}
.tgoal::after{content:"";position:absolute;left:50%;width:1.5px;height:var(--stem,40px);background:var(--c)}
.tgoal.home::after{top:100%} .tgoal.away::after{bottom:100%}

.poss{display:grid;gap:14px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.brow{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:10px}
.brow b{font-size:15px;font-weight:700}
.brow b:last-child{text-align:right}
.brow .lbl{grid-column:1/-1;font-size:12px;color:var(--faint);font-weight:600;text-align:center;margin-bottom:-6px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px}
.bar i{display:block;height:100%;background:var(--c);width:var(--w);transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--ease)}
.bar i:last-child{transform-origin:right}
.is-in .bar i{transform:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;max-width:min(92vw,420px);background:var(--fg);color:#111214;font-weight:600;font-size:14px;padding:12px 18px;border-radius:var(--r-md);box-shadow:0 12px 30px rgba(0,0,0,.45);transition:opacity .25s,transform .35s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  .results{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .groups{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hl-strip{grid-auto-columns:300px}
  .jag{padding:40px 24px 30px}
}
@media (min-width:960px){
  main{padding-block:28px 88px}
  .two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
  .results{grid-template-columns:repeat(4,minmax(0,1fr))}
  .club{min-height:220px;padding:28px}
}
@media (max-width:380px){
  .thead,.row{grid-template-columns:28px 32px minmax(0,1fr) 40px 34px;gap:8px;padding:0 10px}
  .form i:nth-child(-n+2){display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---- kick.ai v2 additions (real video player, plain banner) ---- */
/* plain tournament banner (not JAG): same frame as .jag, kick.ai orange instead of gold */
.tban{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:34px 20px 30px;text-align:center;display:grid;gap:10px;justify-items:center;min-height:180px;align-content:center;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,107,31,.16),transparent 60%),linear-gradient(180deg,#14171A,#0E1012);border:1px solid var(--line)}
.tcard .tban{border:0;border-radius:0}
.tban-k{font-family:var(--font-mono,"JetBrains Mono",monospace);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange)}
.tban h1{font-weight:500;font-size:clamp(30px,8vw,48px);letter-spacing:-.03em;line-height:1.05;color:var(--text)}
/* real goal clip in the prototype's stage */
.stage{aspect-ratio:16/9;background:#000}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;cursor:pointer}
.stage #ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sload{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);background:rgba(0,0,0,.55);padding:3px 9px;border-radius:999px}
.sload[hidden]{display:none}
.minimap{position:absolute;right:8px;top:8px;display:block;pointer-events:none;background:transparent}
.minimap[hidden]{display:none}
.player:fullscreen{background:#000;padding:12px;overflow:auto}
.player:fullscreen .stage{max-height:78vh;aspect-ratio:auto;height:78vh}
.btn:disabled{opacity:.6;cursor:default}
#hlBox{min-width:0;display:grid}
.section>*{min-width:0}
.fsbtn{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.fsbtn .ic{width:18px;height:18px}
.fsbtn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
/* full position table (no groups): # · crest · team · PJ · DG · Forma · Pts */
.table.full .thead,.table.full .row{grid-template-columns:30px 32px minmax(0,1fr) 30px 36px 62px 36px}
.table.full .r{text-align:right;justify-content:flex-end}
.table.full .row .r{color:var(--muted,inherit);font-size:14px}
@media (max-width:639px){.table.full .thead,.table.full .row{grid-template-columns:22px 28px minmax(0,1fr) 22px 30px 44px 28px;gap:6px;padding:0 10px}}
/* toggles on the video (owner 2026-11-11): players / pitch lines / map */
.vtoggles{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;z-index:2}
.vt{font:inherit;font-size:12px;font-weight:700;padding:6px 11px;min-height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);color:rgba(255,255,255,.7);cursor:pointer}
.vt[aria-pressed="true"]{background:rgba(255,107,31,.92);border-color:transparent;color:#fff}
.vt:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* video fits the screen height (owner: too big on his screen) */
@media (min-width:640px){.player{max-width:min(100%, calc((100svh - 320px) * 16 / 9 + 26px));margin-inline:auto;width:100%}}
.demo-tag{margin:0 0 8px;font-size:12px;font-weight:700;color:#1a1a1a;background:#ffd400;display:inline-block;padding:3px 10px;border-radius:999px}
/* heat map card (match page) */
.heat-card{display:grid;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.heat-ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.heat-ctl .seg button{display:inline-flex;align-items:center;gap:6px}
.hdot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.heat{display:block;width:100%;border-radius:var(--r-md)}
.heat-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted,#9aa0a6);font-weight:600}
.heat-foot .att{display:inline-flex;align-items:center;gap:4px;color:var(--orange,#ff6b1f)}
.heat-foot .ic{width:14px;height:14px}
@media (max-width:639px){.vtoggles{left:6px;bottom:6px;gap:4px}.vt{font-size:10.5px;padding:3px 8px;min-height:24px}.fsbtn{width:30px;height:30px;right:6px;bottom:6px}}
</style>
